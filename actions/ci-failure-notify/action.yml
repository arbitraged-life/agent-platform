name: Concise CI failure notification
description: Post one bounded failure notification to an HTTPS webhook without polling.
inputs:
  repository:
    description: Repository name, for example owner/repo.
    required: true
  workflow:
    description: Workflow name that failed.
    required: true
  conclusion:
    description: Workflow conclusion.
    required: true
  run-url:
    description: Canonical URL for the failed run.
    required: true
  sha:
    description: Commit SHA tested by the failed run.
    required: true
  webhook-url:
    description: HTTPS endpoint that accepts a JSON notification payload.
    required: true
runs:
  using: composite
  steps:
    - name: Send concise failure notification
      shell: bash
      env:
        CI_NOTIFY_REPOSITORY: ${{ inputs.repository }}
        CI_NOTIFY_WORKFLOW: ${{ inputs.workflow }}
        CI_NOTIFY_CONCLUSION: ${{ inputs.conclusion }}
        CI_NOTIFY_RUN_URL: ${{ inputs.run-url }}
        CI_NOTIFY_SHA: ${{ inputs.sha }}
        CI_NOTIFY_WEBHOOK_URL: ${{ inputs.webhook-url }}
        CI_NOTIFY_PAYLOAD_FILE: ${{ runner.temp }}/ci-failure-notification.json
      run: |
        python3 - <<'PY'
        import ipaddress
        import json
        import os
        import urllib.parse

        values = {
            "repository": os.environ["CI_NOTIFY_REPOSITORY"].strip(),
            "workflow": os.environ["CI_NOTIFY_WORKFLOW"].strip(),
            "conclusion": os.environ["CI_NOTIFY_CONCLUSION"].strip(),
            "run-url": os.environ["CI_NOTIFY_RUN_URL"].strip(),
            "sha": os.environ["CI_NOTIFY_SHA"].strip(),
            "webhook-url": os.environ["CI_NOTIFY_WEBHOOK_URL"].strip(),
        }
        missing = [name for name, value in values.items() if not value]
        if missing:
            raise SystemExit("required action inputs are empty: " + ", ".join(missing))
        if values["conclusion"] != "failure":
            print(f"CI conclusion is {values['conclusion']}; no failure notification sent")
            raise SystemExit(0)

        url = values["webhook-url"]
        parsed = urllib.parse.urlparse(url)
        if (
            parsed.scheme != "https"
            or not parsed.hostname
            or parsed.username
            or parsed.password
            or parsed.fragment
        ):
            raise SystemExit("webhook-url must be an absolute HTTPS URL without userinfo or fragment")
        if parsed.hostname.casefold() == "localhost":
            raise SystemExit("webhook-url must not target localhost")
        try:
            address = ipaddress.ip_address(parsed.hostname)
        except ValueError:
            address = None
        if address and not address.is_global:
            raise SystemExit("webhook-url must not use a non-public IP literal")

        repository = values["repository"]
        workflow = values["workflow"]
        run_url = values["run-url"]
        sha = values["sha"]
        short_sha = sha[:12]
        message = f"CI failed: {repository} · {workflow} · {short_sha} · {run_url}"
        payload = {
            "text": message,
            "repository": repository,
            "workflow": workflow,
            "sha": sha,
            "run_url": run_url,
            "status": "failure",
        }
        with open(os.environ["CI_NOTIFY_PAYLOAD_FILE"], "w", encoding="utf-8") as handle:
            json.dump(payload, handle)
        print(message)
        PY

        if [ "$CI_NOTIFY_CONCLUSION" != "failure" ]; then
          exit 0
        fi

        curl \
          --fail-with-body \
          --silent \
          --show-error \
          --proto '=https' \
          --max-redirs 0 \
          --connect-timeout 5 \
          --max-time 10 \
          --noproxy '*' \
          --header 'Content-Type: application/json' \
          --data-binary "@$CI_NOTIFY_PAYLOAD_FILE" \
          "$CI_NOTIFY_WEBHOOK_URL"
