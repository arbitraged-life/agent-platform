merge_queue:
  mode: serial
  max_parallel_checks: 1

merge_protections_settings:
  reporting_method: check-runs
  post_comment: false
  auto_merge_conditions:
    - or:
        - and:
            - label = renovate-automerge
            - -label = security
        - label = merge-ready

merge_protections:
  - name: main branch validation
    description: Require deterministic CI and security checks before Mergify can merge to main.
    if:
      - base = main
    success_conditions:
      - "#changes-requested-reviews-by = 0"
      - check-success = @github-actions/validate (ubuntu-24.04)
      - check-success = @github-actions/validate (macos-14)
      - check-success = @github-actions/secrets
      - check-success = qlty check
      - check-success = @gitguardian/GitGuardian Security Checks
      - "check-success = @socket-security/Socket Security: Pull Request Alerts"

  - name: conventional pull request title
    description: The squash commit inherits the PR title, so main history must use Conventional Commits.
    if:
      - base = main
    success_conditions:
      - 'title ~= ^(fix|feat|docs|style|refactor|perf|test|build|ci|chore|revert)(?:\(.+\))?: .+'

queue_rules:
  - name: default
    batch_size: 1
    merge_method: squash
    commit_message_format:
      title: pr-title
      body: pr-body
      trailers: []
    queue_conditions:
      - base = main
      - check-success = @github-actions/validate (ubuntu-24.04)
      - check-success = @github-actions/validate (macos-14)
      - check-success = @github-actions/secrets
      - check-success = qlty check

priority_rules:
  - name: security fixes first
    conditions:
      - title ~= \[security\]
    priority: high

  - name: routine Renovate updates
    conditions:
      - author = renovate[bot]
    priority: low

pull_request_rules:
  - name: notify merge conflicts
    conditions:
      - base = main
      - conflict
    actions:
      comment:
        message: "Mergify detected a merge conflict. Resolve it before queueing this pull request."

  - name: close inactive pull requests
    description: Close non-exempt PRs after 74 days without activity; any new activity resets the clock.
    conditions:
      - base = main
      - -closed
      - -label = pinned
      - -label = security
      - -label = keep
      - updated-at < 74 days ago
    actions:
      close:
        message: "Closing after 74 days without activity. Reopen if this work becomes active again."
