merge_queue:
  mode: serial
  max_parallel_checks: 1

merge_protections_settings:
  reporting_method: check-runs
  post_comment: false
  # New owner-authored, same-repository PRs queue after required CI and
  # Merge Protections pass. Existing PRs stay label-gated to avoid bulk
  # merging the pre-cutover backlog; Renovate keeps its own merge owner.
  # Evaluate Renovate against the required protection check while keeping
  # actual Mergify queue rules Renovate-excluded. Renovate's own per-PR
  # eligibility policy owns native GitHub auto-merge; no bulk major merge.
  auto_merge_conditions:
    - or:
        - author = renovate[bot]
        - label = merge-ready
        - and:
            - author = arbitraged-life
            - -from-fork
            - number > 87

merge_protections:
  - name: main branch validation
    description: Require deterministic CI and security checks before Mergify can merge to main.
    if:
      - base = main
    success_conditions:
      - "#changes-requested-reviews-by = 0"
      - check-success = @github-actions/validate (ubuntu-24.04)
      - check-success = @github-actions/validate (macos-14)
      - check-success = @github-actions/secrets
      - check-success = qlty check
      - check-success = @gitguardian/GitGuardian Security Checks
      - "check-success = @socket-security/Socket Security: Pull Request Alerts"

  - name: conventional pull request title
    description: The squash commit inherits the PR title, so main history must use Conventional Commits.
    if:
      - base = main
    success_conditions:
      - 'title ~= ^(fix|feat|docs|style|refactor|perf|test|build|ci|chore|revert)(?:\(.+\))?: .+'

queue_rules:
  - name: default
    batch_size: 1
    merge_method: squash
    commit_message_format:
      title: pr-title
      body: pr-body
      trailers: []
    queue_conditions:
      - base = main
      - -author = renovate[bot]
      - check-success = @github-actions/validate (ubuntu-24.04)
      - check-success = @github-actions/validate (macos-14)
      - check-success = @github-actions/secrets
      - check-success = qlty check

priority_rules:
  - name: security fixes first
    conditions:
      - title ~= \[security\]
    priority: high

pull_request_rules:
  - name: notify merge conflicts
    conditions:
      - base = main
      - -author = renovate[bot]
      - conflict
    actions:
      comment:
        message: "Mergify detected a merge conflict. Resolve it before queueing this pull request."

  - name: mark inactive pull requests stale
    description: Mark non-exempt PRs stale after 60 days without activity.
    conditions:
      - base = main
      - -author = renovate[bot]
      - -closed
      - -draft
      - -label = stale
      - -label = pinned
      - -label = security
      - -label = keep
      - updated-at < 60 days ago
    actions:
      label:
        add:
          - stale
      comment:
        message: "This pull request has been marked stale after 60 days without activity. Comment or update it to keep it open."

  - name: close stale pull requests
    description: Close stale non-exempt PRs after a 14-day grace period.
    conditions:
      - base = main
      - -author = renovate[bot]
      - -closed
      - label = stale
      - -label = pinned
      - -label = security
      - -label = keep
      - updated-at < 14 days ago
    actions:
      close:
        message: "Closing after the 14-day stale grace period. Reopen if this work becomes active again."
