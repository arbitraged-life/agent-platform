name: Structured review
on:
  workflow_call:
    inputs:
      policy_path:
        description: Review policy in the caller default branch
        required: true
        type: string
      provider_oidc_audience:
        description: Explicit provider audience; empty uses the supplied provider token
        required: false
        default: ''
        type: string
    secrets:
      provider_token:
        required: false
      publisher_token:
        required: false
permissions:
  contents: read
  pull-requests: write
  id-token: write
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: structured-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Harden Runner
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: arbitraged-life/agent-platform
          ref: 7cbaa830a40abbe9d373763a61f39f8acf02895d
          path: platform
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: policy
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Resolve trusted policy and current review snapshot
        id: context
        env:
          POLICY_PATH: ${{ inputs.policy_path }}
          REVIEW_GITHUB_TOKEN: ${{ secrets.publisher_token || github.token }}
        run: |
          python3 -I platform/scripts/review/review.py context \
            --config "policy/$POLICY_PATH" --event "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" --snapshot "$RUNNER_TEMP/review-snapshot.json"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/pull/${{ steps.context.outputs.number }}/head
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Acquire explicitly requested provider identity
        if: inputs.provider_oidc_audience != ''
        env:
          PROVIDER_AUDIENCE: ${{ inputs.provider_oidc_audience }}
          SUPPLIED_PROVIDER_TOKEN: ${{ secrets.provider_token }}
        run: |
          python3 -I - <<'PY'
          import os
          from pathlib import Path
          import re
          import sys
          from urllib.parse import quote
          sys.path.insert(0, str(Path('platform').resolve()))
          from runtime.review.transport import request
          try:
              if os.environ.get('SUPPLIED_PROVIDER_TOKEN'):
                  raise ValueError('Select one provider authentication mechanism')
              url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
              response = request(url + '&audience=' + quote(os.environ['PROVIDER_AUDIENCE'], safe=''),
                                 os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN'], method='GET')
              value = response.get('value') if isinstance(response, dict) else None
              if not isinstance(value, str) or not re.fullmatch(r'[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+', value):
                  raise ValueError('Invalid identity response')
              print('::add-mask::' + value)
              with open(os.environ['GITHUB_ENV'], 'a') as stream:
                  stream.write('REVIEW_OIDC_TOKEN=' + value + '\n')
          except Exception:
              raise SystemExit('Provider identity acquisition failed') from None
          PY
      - name: Review immutable snapshot without executing candidate code
        env:
          POLICY_PATH: ${{ inputs.policy_path }}
          REVIEW_GITHUB_TOKEN: ${{ secrets.publisher_token || github.token }}
          REVIEW_PROVIDER_TOKEN: ${{ secrets.provider_token }}
        run: |
          if [ -n "${REVIEW_OIDC_TOKEN:-}" ]; then
            export REVIEW_PROVIDER_TOKEN="$REVIEW_OIDC_TOKEN"
          fi
          python3 -I platform/scripts/review/review.py run \
            --config "policy/$POLICY_PATH" --event "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" --snapshot "$RUNNER_TEMP/review-snapshot.json" \
            --checkout candidate
