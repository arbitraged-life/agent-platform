name: Test Insights

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * 1-5'

permissions:
  contents: read

concurrency:
  group: test-insights-${{ github.ref }}
  cancel-in-progress: true

jobs:
  insights-config:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      available: ${{ steps.uploader.outputs.available }}
    steps:
      - name: Check Test Insights credential availability
        id: uploader
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        shell: bash
        run: |
          if [ -n "$MERGIFY_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  node-tests:
    needs: insights-config
    if: ${{ github.event_name == 'schedule' || needs.insights-config.outputs.available == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      test-outcome: ${{ steps.tests.outcome }}
    env:
      RUN_COUNT: ${{ github.event_name == 'schedule' && 5 || 1 }}
    steps:
      - name: Harden Runner
        if: ${{ github.event.repository.private == false }}
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: github.event_name == 'schedule'
        with:
          python-version: '3.14.9'
      - name: Run Node tests with JUnit
        id: tests
        if: needs.insights-config.outputs.available == 'true'
        continue-on-error: true
        shell: bash
        run: |
          failed=0
          for i in $(seq "$RUN_COUNT"); do
            node --test \
              --test-reporter=junit \
              --test-reporter-destination="test-results-$i.xml" \
              tests/unit/*.test.mjs || failed=1
          done
          exit "$failed"
      - name: Transfer JUnit reports
        if: ${{ always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node-test-results-${{ github.run_attempt }}
          path: test-results-*.xml
          retention-days: 1
          include-hidden-files: false
          if-no-files-found: error
      - name: Check current dependency advisories (existing scheduled run)
        if: ${{ always() && github.event_name == 'schedule' }}
        run: python3 scripts/audit_dependencies.py
      - name: Preserve test failure
        if: ${{ always() && steps.tests.outcome == 'failure' }}
        run: exit 1

  upload-test-insights:
    needs: [insights-config, node-tests]
    if: ${{ always() && needs.insights-config.outputs.available == 'true' && (needs.node-tests.outputs.test-outcome == 'success' || needs.node-tests.outputs.test-outcome == 'failure') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: node-test-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/insights-reports
      - name: Upload test results to Mergify Test Insights
        uses: Mergifyio/gha-mergify-ci@ce0d6bef01217d90fb9e908e6966b0f6f4ea26d5 # v26
        with:
          action: junit-process
          token: ${{ secrets.MERGIFY_TOKEN }}
          report_path: ${{ runner.temp }}/insights-reports/test-results-*.xml
          job_name: node-tests
          test_step_outcome: ${{ needs.node-tests.outputs.test-outcome }}
