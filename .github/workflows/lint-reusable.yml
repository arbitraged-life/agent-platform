name: lint-reusable

"on":
  workflow_call:
    inputs:
      strict:
        description: "Fail the check on lint findings (secrets always fail)."
        type: boolean
        default: false
      swift_strict:
        description: "Run SwiftLint in --strict (any warning fails). Overrides strict for Swift."
        type: boolean
        default: false

permissions:
  contents: read
env:
  LINT_EXCLUDED_DIRECTORIES: '["node_modules","Pods",".build","build","target","DerivedData","dist","vendor","third_party","whisper.cpp"]'
defaults:
  run:
    shell: bash

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── detect which languages are present (drives the conditional jobs) ────────
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      swift: ${{ steps.d.outputs.swift }}
      python: ${{ steps.d.outputs.python }}
      js: ${{ steps.d.outputs.js }}
      shell: ${{ steps.d.outputs.shell }}
      yaml: ${{ steps.d.outputs.yaml }}
      cpp: ${{ steps.d.outputs.cpp }}
    steps:
      - name: Harden Runner
        if: ${{ github.event.repository.private == false }}
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: d
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json
          import os
          import pathlib
          import subprocess
          excluded = set(json.loads(os.environ['LINT_EXCLUDED_DIRECTORIES']))
          extensions = {'swift': {'.swift'}, 'python': {'.py'},
                        'js': {'.js', '.jsx', '.mjs', '.cjs', '.ts', '.tsx', '.mts', '.cts'}, 'shell': {'.sh', '.bash'},
                        'yaml': {'.yml', '.yaml'}, 'cpp': {'.c', '.cc', '.cpp', '.cxx', '.mm'}}
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode('utf-8', 'surrogateescape').split('\0')
          suffixes = {path.suffix for name in names if name
                      for path in [pathlib.PurePosixPath(name)]
                      if not excluded.intersection(path.parts)}
          for language, supported in extensions.items():
              print(f'{language}={str(bool(suffixes & supported)).lower()}')
          PYTHON

  swift:
    needs: detect
    if: needs.detect.outputs.swift == 'true'
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        if: ${{ github.event.repository.private == false }}
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: SwiftLint
        run: |
          curl --fail --silent --show-error --location --max-time 120 \
            https://github.com/realm/SwiftLint/releases/download/0.59.1/portable_swiftlint.zip \
            --output "$RUNNER_TEMP/swiftlint.zip"
          echo "58f9be8a4677900c945e2c618168223f4dd620a0cc65c9ccc5ea0f70433e89c1  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 --check
          mkdir "$RUNNER_TEMP/swiftlint-bin"
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint-bin"
          export PATH="$RUNNER_TEMP/swiftlint-bin:$PATH"
          swiftlint version
          if [ "${{ inputs.swift_strict }}" = "true" ]; then
            swiftlint --strict --reporter github-actions-logging
          elif [ "${{ inputs.strict }}" = "true" ]; then
            swiftlint --reporter github-actions-logging
          else
            swiftlint --reporter github-actions-logging || true
          fi

  python:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Harden Runner
        if: ${{ github.event.repository.private == false }}
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Ruff
        run: |
          python3 -m venv "$RUNNER_TEMP/ruff"
          "$RUNNER_TEMP/ruff/bin/pip" install ruff==0.12.9
      - name: Ruff check
        run: '"$RUNNER_TEMP/ruff/bin/ruff" check --output-format=github'
        continue-on-error: ${{ !inputs.strict }}

  js:
    needs: detect
    if: needs.detect.outputs.js == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Harden Runner
        if: ${{ github.event.repository.private == false }}
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: "2.2.2"
      - name: Biome check
        env:
          LINT_STRICT: ${{ inputs.strict }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          result = subprocess.run(['biome', 'ci', '--reporter=json', '--colors=off', '--max-diagnostics=none', '.'],
                                  capture_output=True, text=True, timeout=300)
          if result.returncode == 0:
              print('Biome passed.')
              raise SystemExit(0)
          if result.returncode != 1:
              raise SystemExit('Biome command failed; exit status ' + str(result.returncode))
          try:
              report = json.loads(result.stdout)
              diagnostics = report['diagnostics']
              if not isinstance(diagnostics, list) or not diagnostics:
                  raise ValueError('Missing diagnostics')
              for item in diagnostics:
                  category = item.get('category', '')
                  if not isinstance(category, str) or not category.startswith(('lint/', 'format', 'assist/')):
                      raise ValueError('Configuration or internal error')
          except (ValueError, KeyError, TypeError, AttributeError):
              raise SystemExit('Biome did not return ordinary source diagnostics; run biome ci locally for details.')
          print('Biome reported ' + str(len(diagnostics)) + ' source diagnostics.')
          raise SystemExit(1 if os.environ['LINT_STRICT'] == 'true' else 0)
          PYTHON

  shell:
    needs: detect
    if: needs.detect.outputs.shell == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        if: ${{ github.event.repository.private == false }}
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: ShellCheck
        env:
          LINT_STRICT: ${{ inputs.strict }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck=0.9.0-1
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import PurePosixPath
          import subprocess
          excluded = set(json.loads(os.environ['LINT_EXCLUDED_DIRECTORIES']))
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode('utf-8', 'surrogateescape').split('\0')
          files = ['./' + name for name in names if name
                   and PurePosixPath(name).suffix in {'.sh', '.bash'}
                   and not excluded.intersection(PurePosixPath(name).parts)]
          if files:
              result = subprocess.run(['shellcheck', '--', *files])
              status = result.returncode
              raise SystemExit(0 if status == 1 and os.environ['LINT_STRICT'] == 'false' else status)
          PYTHON

  yaml:
    needs: detect
    if: needs.detect.outputs.yaml == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        if: ${{ github.event.repository.private == false }}
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: yamllint
        run: |
          python3 -m venv "$RUNNER_TEMP/yamllint"
          "$RUNNER_TEMP/yamllint/bin/pip" install yamllint==1.37.1 pathspec==0.12.1 PyYAML==6.0.3
          export PATH="$RUNNER_TEMP/yamllint/bin:$PATH"
          yamllint -f github . \
            || { [ "${{ inputs.strict }}" = "true" ] && exit 1 || true; }

  cpp:
    needs: detect
    if: needs.detect.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Harden Runner
        if: ${{ github.event.repository.private == false }}
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: cppcheck
        env:
          LINT_STRICT: ${{ inputs.strict }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck=2.13.0-2ubuntu3
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import PurePosixPath
          import subprocess
          excluded = set(json.loads(os.environ['LINT_EXCLUDED_DIRECTORIES']))
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode('utf-8', 'surrogateescape').split('\0')
          files = ['./' + name for name in names if name
                   and PurePosixPath(name).suffix in {'.c', '.cc', '.cpp', '.cxx', '.mm'}
                   and not excluded.intersection(PurePosixPath(name).parts)]
          if files:
              code = '1' if os.environ['LINT_STRICT'] == 'true' else '0'
              raise SystemExit(subprocess.run(['cppcheck', '--enable=warning,portability',
                  '--quiet', '--inline-suppr', '--error-exitcode=' + code, *files]).returncode)
          PYTHON

  secrets:
    # ALWAYS runs (no detect gate) and ALWAYS hard-fails on a hit.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        if: ${{ github.event.repository.private == false }}
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl --fail --silent --show-error --location --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--all" --redact --no-banner
