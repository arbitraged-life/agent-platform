name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'ubuntu-24.04' && 30 || 15 }}
    steps:
      - name: Harden Runner
        if: ${{ github.event.repository.private == false }}
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.9'
      - run: ./scripts/setup
        env:
          PIP_CACHE_DIR: ${{ runner.temp }}/pip-python-3.14
      - name: Knip report (advisory findings; tool errors fail)
        run: npm run lint:knip:report
      - name: Exercise real local report cache without caching validation
        run: |
          npm run quality:cached -- --summarize
          npm run quality:cached -- --summarize
      - run: ./scripts/validate
      # Keep compatibility inside the existing required Linux check, not advisory
      # jobs or another matrix dimension that would rename Mergify's checks.
      - name: Select Python 3.12 compatibility line
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate Python 3.12 in a fresh environment
        if: matrix.os == 'ubuntu-24.04'
        env:
          PIP_CACHE_DIR: ${{ runner.temp }}/pip-python-3.12
        run: |
          mv .venv "$RUNNER_TEMP/validation-python-3.14"
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          ./scripts/setup
          .venv/bin/python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          ./scripts/validate
      - name: Select Python 3.13 compatibility line
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Validate Python 3.13 in a fresh environment
        if: matrix.os == 'ubuntu-24.04'
        env:
          PIP_CACHE_DIR: ${{ runner.temp }}/pip-python-3.13
        run: |
          mv .venv "$RUNNER_TEMP/validation-python-3.12"
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 13), sys.version'
          ./scripts/setup
          .venv/bin/python -c 'import sys; assert sys.version_info[:2] == (3, 13), sys.version'
          ./scripts/validate
  review-identity:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        if: ${{ github.event.repository.private == false }}
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.9'
      - name: Verify authenticated review identity (read-only)
        env:
          REVIEW_IDENTITY_TOKEN: ${{ github.token }}
          REVIEW_IDENTITY_REPOSITORY: ${{ github.repository }}
        run: python3 -I tests/integration/review-identity.py
  secrets:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        if: ${{ github.event.repository.private == false }}
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve manual scan base
        id: manual-scan
        if: github.event_name == 'workflow_dispatch'
        run: |
          if base=$(git rev-parse --verify "$GITHUB_SHA^" 2>/dev/null); then
            printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"
          fi
      - name: Run finding-specific TruffleHog gate
        env:
          TRUFFLEHOG_MANUAL_BASE: ${{ steps.manual-scan.outputs.base || '' }}
        run: python3 -I scripts/trufflehog_gate.py
