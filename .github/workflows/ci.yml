name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        if: ${{ github.event.repository.private == false }}
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.8'
      - run: ./scripts/setup
      - run: ./scripts/validate
  review-identity:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        if: ${{ github.event.repository.private == false }}
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.8'
      - name: Verify authenticated review identity (read-only)
        env:
          REVIEW_IDENTITY_TOKEN: ${{ github.token }}
          REVIEW_IDENTITY_REPOSITORY: ${{ github.repository }}
        run: python3 -I tests/integration/review-identity.py
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        if: ${{ github.event.repository.private == false }}
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve manual scan base
        id: manual-scan
        if: github.event_name == 'workflow_dispatch'
        run: |
          if base=$(git rev-parse --verify "$GITHUB_SHA^" 2>/dev/null); then
            printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"
          fi
      - uses: trufflesecurity/trufflehog@f15cb8b37b9b70056bc82a8eb7151f75fad27a71
        with:
          # A root commit has no parent; scan its complete (one-commit) history.
          base: ${{ steps.manual-scan.outputs.base || '' }}
          head: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
          extra_args: --no-verification
